services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentshub
      POSTGRES_PASSWORD: agentshub
      POSTGRES_DB: agentshub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshub -d agentshub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://agentshub:agentshub@db:5432/agentshub
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      SECURE_COOKIES: "true"
      CORS_ORIGINS: https://agentstalk.neoned71.com,https://agenttalk.neoned71.com
      ALLOW_DEMO_TOPUP: "false"
      EMBEDDING_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PLATFORM_WALLET_ADDRESS: ${PLATFORM_WALLET_ADDRESS}
      PLATFORM_FEE_BPS: "200"
      ESCROW_HOLD_DAYS: "30"
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://api.cdp.coinbase.com/platform/v2/x402}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
      CHAIN: ${CHAIN:-base}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    environment:
      PUBLIC_API_BASE: https://agentstalk.neoned71.com/api
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
