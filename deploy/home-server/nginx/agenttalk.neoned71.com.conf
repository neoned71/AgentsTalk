server {
    listen 443 ssl http2;
    server_name agenttalk.neoned71.com;

    # point these at the cert/key paths used by your nginx setup
    # ssl_certificate     /etc/letsencrypt/live/agenttalk.neoned71.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agenttalk.neoned71.com/privkey.pem;

    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_path  / /;
    }

    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

server {
    listen 80;
    server_name agenttalk.neoned71.com;
    return 301 https://$host$request_uri;
}
